name: Bug report
description: Report a reproducible problem with Supernote Cloud Sync
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, tokens, private notebook content, or personal paths. Report suspected vulnerabilities through the private link below the issue choices.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: "1.9.12"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: operating-system-version
    attributes:
      label: Operating system version
      placeholder:
        "Windows 11 24H2, macOS 15.5, Ubuntu 24.04, iOS 18.5, or Android 16"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Secret-free diagnostics
      description:
        In Supernote Cloud Sync settings, open Setup, choose Copy diagnostics,
        review the block, remove anything private, and paste it here.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description:
        Use the smallest sequence that consistently demonstrates the problem.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description:
        Add sanitized logs, screenshots, or other details if they help.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label:
            I removed credentials, tokens, private notebook content, and
            personal paths.
          required: true
